name: CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never interrupt a deploy mid-flight

permissions:
  contents: read

env:
  NODE_VERSION: "20.x"

jobs:
  # Deployment is gated on the full CI suite so a failing model quality gate
  # cannot reach production.
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server tests
        working-directory: server
        run: npm run test:ci
        env:
          JWT_SECRET: ci-test-secret
          SELLER_EMAIL: seller@ci.test
          NODE_ENV: test

      - name: ML quality gate
        working-directory: server
        run: node scripts/evaluate-model.js

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Client build
        working-directory: client
        run: npm run build
        env:
          VITE_CURRENCY: "₹"
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}

  deploy-server:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: ${{ inputs.environment || 'production' }}
    # Skips cleanly on forks or before secrets are configured.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_SERVER_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel secrets are not configured; skipping API deploy."
          fi

      - name: Deploy to Vercel
        if: steps.creds.outputs.ready == 'true'
        working-directory: server
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SERVER_PROJECT_ID }}
          PROD_FLAG: ${{ (inputs.environment == 'preview') && '' || '--prod' }}
        run: npx --yes vercel@latest deploy $PROD_FLAG --yes --token "${{ secrets.VERCEL_TOKEN }}"

  deploy-client:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [verify, deploy-server]
    environment:
      name: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_CLIENT_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel secrets are not configured; skipping web deploy."
          fi

      - name: Deploy to Vercel
        if: steps.creds.outputs.ready == 'true'
        working-directory: client
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
          PROD_FLAG: ${{ (inputs.environment == 'preview') && '' || '--prod' }}
        run: npx --yes vercel@latest deploy $PROD_FLAG --yes --token "${{ secrets.VERCEL_TOKEN }}"

  post-deploy-check:
    name: Post-deploy health check
    runs-on: ubuntu-latest
    needs: [deploy-server, deploy-client]
    if: always() && needs.deploy-server.result == 'success'
    steps:
      - name: Probe API health and the AI model endpoint
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::API_URL variable is not set; skipping post-deploy probe."
            exit 0
          fi

          for path in /health /api/ai/health; do
            echo "Probing $API_URL$path"
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 --retry 5 --retry-delay 5 "$API_URL$path")
            cat /tmp/body
            if [ "$code" != "200" ]; then
              echo "::error::$path returned $code"
              exit 1
            fi
          done
          echo "Post-deploy checks passed."
